# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

# project - the formalization itself (not the source).
project:
  name: "JPointsLean: a verified model of j-points"
  description: >
    A Lean 4 model of j-points, the C program that finds the rational points of bounded height on
    the Jacobian of a curve of genus 2, y^2 = f(x) with f of degree 5 or 6 with integer
    coefficients, by sieving the first three coordinates of their images on the Kummer surface and
    lifting the survivors to the Jacobian. The model mirrors the C code function by function (the
    same loops, tables, bit arrays of 64-bit words, index arithmetic and doubles, these by their
    IEEE 754 bits); the proofs show that, on every command line that the program accepts, for every
    value of the options of the sieve and whatever primes and mode its cost model chooses, the
    program prints under -q exactly the points of a short specification on Mathlib, in the order of
    the C program, each once, only the first under -1, in a format of -f that the model admits, and
    exits with the status 0, assuming Sturm's theorem (unless the sieve has no primes at all, which -N with a value of at most 0 gives)
    and a height bound of at most 2^26; a correspondence record and differential tests link the
    model to the C code.
  authors: ["Michael Stoll"]
  responsible_maintainers: ["Michael Stoll"]
  license: "Apache-2.0"

# sources - what was formalized.
sources:
  - title: "j-points: a program to find rational points on Jacobians of genus 2 curves, release 3.0.1"
    authors: ["Michael Stoll"]
    id: "https://github.com/MichaelStollBayreuth/j-points, tag v3.0.1 (commit 72ada06bca8342c0bca0860fdfea122c977938ac)"
    type: "software"
    location: "the whole program: j-points.c, j-sift.c and j-points.h"
    relationship: "formalizes"
    note: >
      The C code is modeled, not translated (Lean has no semantics of C): every model
      declaration names the lines of C it models, at the pinned commit, and
      scripts/correspondence.py checks the record (correspondence/README.md).
    license: "GPL-2.0-or-later"
    author_endorsement: "participated"
  - title: "j-points (the description of the program and of its command line)"
    authors: ["Michael Stoll"]
    id: "README.md in the repository above, at the same commit"
    type: "manual"
    location: "the description of the search, of the height bound and of the options of the command line"
    relationship: "formalizes"
    note: "The specification of the Lean development is the behavior that the description and the code define."
    license: "GPL-2.0-or-later"
    author_endorsement: "participated"
  - title: "Prolegomena to a Middlebrow Arithmetic of Curves of Genus 2"
    authors: ["J. W. S. Cassels", "E. V. Flynn"]
    id: "London Mathematical Society Lecture Note Series 230, Cambridge University Press, 1996"
    type: "book"
    location: "the Kummer surface of the Jacobian of a curve of genus 2, its coordinates and its equation"
    relationship: "background"
    note: >
      The specification takes the points of the Kummer surface in the coordinates of Cassels and
      Flynn, as j-points does.
    license: ""
    author_endorsement: "n/a"
  - title: "Sturm's theorem on the number of real roots of a polynomial in an interval"
    authors: ["Charles Sturm"]
    id: "C. Sturm, Mémoire sur la résolution des équations numériques (presented 1829, published 1835)"
    type: "article"
    location: "the theorem"
    relationship: "background"
    note: >
      Assumed, not proved: JPoints.SturmTheorem (JPoints/Spec/Sturm.lean) states the theorem as a
      proposition over Mathlib's Sturm sequence (Polynomial.sturmSeq) and sign variations
      (List.signVariations), a hypothesis of the theorems on the program, not an axiom; Mathlib
      does not have the theorem.
    license: ""
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/MichaelStollBayreuth/RatpointsLean"
    relationship: "adapts"
    note: >
      The verified model of ratpoints, from which j-points descends; the doubles of the C code by
      their IEEE 754 bits with their values and rounding, the lemmas on 64-bit words and on
      containers, the simplification of the verification conditions, the statement of Sturm's
      theorem and the checks of the layout and the style are taken from it and adapted to j-points.

classification:
  arxiv: ["math.NT", "cs.LO"]
  msc2020: ["11G30", "11G10", "14H40", "14G05", "11Y50", "68V20"]

# project status
status:
  scope: >
    The whole of the C code of j-points 3.0.1 (j-points.c, j-sift.c and j-points.h), but for the
    threads of -t, the management of memory and of the GMP variables, the instrumentation under
    DEBUG and VERBOSE, the vector builds of the sieve (VECTOR=avx2 or sse2), and lines without a
    counterpart in Lean (the includes, the forward declarations, code without effect in the default
    build). The specification, on Mathlib alone: for the coefficient list of f, the height bound H,
    the option -a and the bound of -w, the points (a, b, c, d) of the Kummer surface of the Jacobian
    of y^2 = f(x), in the coordinates of Cassels and Flynn, that come from rational points of the
    Jacobian (the lifting test of j-points: for a != 0 the auxiliary polynomials A2 and B2 take
    square values; for a = 0 the coefficient f6 of x^6, 0 for a quintic, and, for b != 0, the value
    b^6 f(c / b) are squares), with coprime coordinates whose first nonzero one among a, b, c is
    positive, within the bounds of the command line; the list of these points in the order in which
    j-points finds them (on the curve searched, which may be the reversal of a sextic or the
    negation of a quintic, the coprime triples (a, b, c) of the box in the order of the search, over
    each the rational roots of the Kummer equation in a fixed order, the points mapped back to the
    curve given); and Sturm's theorem as a proposition over Mathlib's Sturm sequence and sign
    variations, which Mathlib does not have. The executable model, on Lean core and Std without
    Mathlib, mirrors the C code function by function: read_input with its checks and its errors,
    among them the squarefree test by Euclid's algorithm over Q; the curve searched with its
    message; the tables of the inverses and of the square roots modulo the primes; the rates of the
    primes, from exact counts or samples of the classes that the curve admits, sorted by the qsort
    of glibc; the cost model, which chooses the mode of the sieve (the box, the real region, or,
    when the fourth coordinate is bounded, the tube without or with the cut of its words to the real
    region) and the primes of its three stages, in Lean core's Float with the log and pow of the C
    library of the platform; the real roots of f, isolated by Sturm sequences in exact arithmetic,
    and the intervals on which f is negative; the analysis of the tube of the bound on the fourth
    coordinate (the coefficients of the Kummer equation over a first coordinate shifted to the
    centers of cells of the plane of (b, c), the bounds of their terms and the signs that the bounds
    show) and the real region of each row, both in doubles held as their IEEE 754 bits, with a model
    function for each operation that j-points applies to them; the condition at 2 modulo 16 or 64;
    the sieve tables of the first two stages, built from the patterns of their rows, and the tables
    of the third; the double points, with a sieve of their own; the main search over the first
    coordinates, on the rows that the primes without points at infinity and the condition at 2
    leave, sifted by bands in the tube or the real region or row by row in the box, on bit arrays of
    64-bit words in three stages, with the reductions by a reciprocal of the prime, the test for
    common factors and the exact check (the Kummer equation solved by its discriminant, the bounds,
    the lifting test on machine words or on GMP integers); the output of the points by printf and
    gmp_printf in the format of -f, the messages of the report and the stop under -1; and the
    command-line program j-points-model, which reads the command line of j-points and prints what it
    prints. The compile-time constants of the C code are definitions of the model, and no proof
    depends on their values beyond the facts decided in JPoints.Proof.Constants, which hold in every
    build that the C code admits (among them TUBE_EPS between 2^-47 and 1). The contracts of the
    components are proved with the program logic of Lean core. The main theorems say that, on every
    command line that read_input accepts, for every value of the options of the sieve and whatever
    primes and mode the cost model chooses, the program under -q, with a format of -f that the model
    admits, prints exactly the points of the specification in its order, only the first under -1,
    and exits with the status 0, assuming Sturm's theorem unless the sieve has no primes at all, which -N with a value of at most 0 gives, and a height bound of at most 2^26; that the points of the specification are exactly the
    points of the curve given, each once; and that under the default format the points read back
    from the output of the program are the list of the specification, exactly the points of the
    curve given, each once. With the four theorems of the brute-force reference (it lists exactly
    the points, each once, in the order of the search, and the list of the specification is its list
    for the curve searched, taken back to the curve given) they are the ten statements of
    comparator/challenges.json, which lake comparator --paranoid accepted on 2026-11-01. Proved but
    not certified: what the program prints without -q, the report around the same points, with the
    numbers of the survivors and of the points found for some totals of its counters. Every line of
    code of the C files is recorded, with the declarations that model it or the reason for its
    exclusion, and CI checks the record against the C code at the pinned commit; the differential
    tests compare j-points-model with j-points, built at the pin on the same machine, byte for byte
    (the standard output, the standard error and the exit status) on the suites of the C repository,
    random curves, the options, the errors, random command lines and failed writes; and the
    brute-force reference, run as j-points-brute, agrees with the 122 lists of points that Magma's
    Kummer package made independently for the curves of the C repository's test4, and with j-points.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "JPoints.mem_bruteForce_iff"
      file: "JPoints/Proof/BruteForce.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/challenges.json"
