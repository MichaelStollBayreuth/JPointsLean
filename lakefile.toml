name = "JPoints"
defaultTargets = ["JPointsModel", "JPoints"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
# Every public definition, structure and field has a docstring (a core linter, so it also covers
# the model; theorems and instances are exempt).
linter.missingDocs = true
# Mathlib's standard style linters (the `weak.` prefix is needed for options that Mathlib, not
# Lean, registers, and makes the model, which does not import Mathlib, ignore them), plus the two
# `omega` analyzers: every `omega` that `lia` can replace is reported, and every `omega` that
# `lia` cannot replace is reported too (a `lia` bug to minimize).
weak.linter.mathlibStandardSet = true
weak.linter.style.header = true
weak.linter.style.longFile = 1500
weak.linter.tacticAnalysis.omegaToLia = true
weak.linter.tacticAnalysis.regressions.omegaToLia = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# Only used by `lake build JPoints:docs`, which generates the API documentation deployed alongside
# the blueprint. A plain `lake build` does not build it. Keep `rev` in sync with `lean-toolchain`.
[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4.git"
rev = "v4.35.0"

# The executable model of j-points: plain code on core and Std, no Mathlib
# (`scripts/check_layout.py` checks the imports). Kept apart from the proofs so that a proof
# broken by a toolchain change never stops the executable or the differential tests.
[[lean_lib]]
name = "JPointsModel"
roots = ["JPoints.Model"]

# Everything: the root `JPoints` imports every module under `JPoints/` (the mk_all listing,
# checked in CI), so this library also covers the specification, the contracts and their proofs,
# and the candidates for Mathlib. Each part root (`JPoints.Model`, `JPoints.Spec`,
# `JPoints.Proof`) imports the modules of its folder, which `scripts/check_layout.py` checks.
[[lean_lib]]
name = "JPoints"

# The brute-force reference `JPoints.bruteForce` as a program
# (`lake exe j-points-brute 'a_0 ... a_d' H [-a] [-w W]`), which `scripts/brutetest.py` compares
# with the reference lists of the C repository and with `j-points`. Its root `BruteMain.lean`
# imports only the model.
[[lean_exe]]
name = "j-points-brute"
root = "BruteMain"

# Comparator (https://github.com/leanprover/comparator) verification harness. Not part of
# `defaultTargets`, so a plain `lake build` ignores it (and never builds the deliberate `sorry`s
# in `comparator/Challenge.lean`). See comparator/README.md.
[[lean_lib]]
name = "Challenge"
srcDir = "comparator"

[[lean_lib]]
name = "Solution"
srcDir = "comparator"
