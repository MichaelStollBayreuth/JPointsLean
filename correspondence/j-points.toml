# The correspondence record between the Lean model and the C code of j-points. The ranges the
# model covers are recorded in the docstrings of the model, in `C:` paragraphs; this file holds
# the pin, the C files the record covers and the ranges excluded from the model. README.md
# describes the record; scripts/correspondence.py checks it.

# The j-points commit every line number refers to: release 3.0.2.
[pin]
repository = "https://github.com/MichaelStollBayreuth/j-points"
tag = "v3.0.2"
commit = "bb7cd5d058a7e6a1780e6c3e4e1833ca410775e8"

# Every line of code of these files lies in exactly one recorded range: modeled (a `C:`
# paragraph of a docstring of the model) or excluded (an [[excluded]] table below), as
# `correspondence.py check --complete` requires. The build modeled is the default one: DEBUG = 0,
# VERBOSE undefined, the scalar walk VW = 1, on an LP64 platform.
[files]
paths = ["j-points.c", "j-sift.c", "j-points.h"]

# The ranges excluded from the model, one table each, in the form
#
#   [[excluded]]
#   file = "j-points.c"
#   lines = "first-last"
#   kind = "threads"
#   reason = "the state of the threads of -t; the model runs the units of work in turn"
#
# with `kind` one of threads, memory, instrumentation (debugging output, the debug build),
# interface and other (headers, forward declarations, the vector builds, dead code). A line that
# the model needs stays with the model even where most of it would be excluded.

